<main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem;">
  <h1>{{ title }}</h1>
  <p>Angular SPA &rarr; Symfony API</p>

  <section style="border: 1px solid #ddd; border-radius: 8px; padding: 1rem;">
    <h2 style="margin-top: 0;">GET /api/ping</h2>

    @if (ping()) {
      <pre style="background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow: auto;">{{ ping() | json }}</pre>
      <p style="color: #1a7f37;">✓ Connected to Symfony</p>
    } @else if (error()) {
      <p style="color: #cf222e;">✗ {{ error() }}</p>
      <p style="font-size: 0.875rem; color: #555;">
        Make sure the Symfony stack is running (<code>docker compose up -d</code>) on http://localhost:8080.
      </p>
    } @else {
      <p>Loading…</p>
    }

    <button (click)="loadPing()" style="margin-top: 0.5rem; padding: 0.4rem 0.8rem;">Retry</button>
  </section>
</main>

<router-outlet />
